name: UNSEEN judge demo narration
on:
  push:
    branches: [film/final-judge-demo]
    paths: [motion/judge-voice/**, .github/workflows/unseen-judge-voice.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "edge-tts>=7,<8"
      - run: python motion/judge-voice/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: UNSEEN-judge-demo-voiceover
          path: motion/judge-voice/out/*
          if-no-files-found: error
          retention-days: 7
