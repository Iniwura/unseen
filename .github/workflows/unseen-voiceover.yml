name: Generate UNSEEN voiceover
on:
  push:
    branches: [film/narrated-release-demo]
    paths:
      - 'motion/narration/**'
      - '.github/workflows/unseen-voiceover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS and media tooling
        run: |
          python -m pip install "edge-tts>=7.0,<8" "gTTS>=2.5,<3"
          ffmpeg -version | head -n 1
      - name: Render six time-aligned narration segments
        run: python motion/narration/make_voice.py
      - name: Upload voiceover segments and timings
        uses: actions/upload-artifact@v4
        with:
          name: UNSEEN-narration
          path: motion/narration/out/*
          retention-days: 7
          if-no-files-found: error
